<div style="display: flex; align-items: center; gap: 8px"><button type="button" onClick="{{ rtDec }}" aria-label="Diminuer" style="display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; flex: none; border-radius: 10px; background: #FFFFFF; color: #111827; border: 1px solid #4B5563; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M5 12h14"></path></svg></button><label for="rt1" style="position: absolute; width: 1px; height: 1px; overflow: hidden">Quantité restituée</label><input id="rt1" type="text" inputmode="decimal" value="{{ rt }}" onChange="{{ rtSet }}" style="box-sizing: border-box; width: 96px; height: 48px; padding: 0 12px; text-align: right; border: 1px solid #D5DBE1; border-radius: 6px; background: #FFFFFF; color: #111827; font-family: inherit; font-family: Space Grotesk, Inter, system-ui, sans-serif; letter-spacing: -0.01em; font-size: 20px; font-weight: 600"><button type="button" onClick="{{ rtInc }}" aria-label="Augmenter" style="display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; flex: none; border-radius: 10px; background: #FFFFFF; color: #111827; border: 1px solid #4B5563; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M12 5v14M5 12h14"></path></svg></button><span style="font-family: Space Grotesk, Inter, system-ui, sans-serif; letter-spacing: -0.01em; font-size: 20px; font-weight: 600">m</span></div></div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const s = Object.assign({"rt": 35}, this.state || {});
const set = (o) => this.setState(o);
const r = {};
r.rt = s.rt; r.rtInc = () => set({rt: Math.min(100, s.rt + 1)}); r.rtDec = () => set({rt: Math.max(1, s.rt - 1)}); r.rtSet = (e) => { const n = parseFloat(String(e.target.value).replace(',', '.')); set({rt: isNaN(n) ? 1 : Math.max(1, Math.min(100, n))}); };
r.rtpct = 100 - s.rt; r.rtcap = (100 - s.rt) + ' m utilisés sur le rouleau de 100 m livré.';
return r;
}
}
</script>
